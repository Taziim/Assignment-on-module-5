name: Vite React CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  test-and-build:
    name: Test and Build React App
    runs-on: self-hosted        # ← Uses your self-hosted runner

    steps:
      # ── 1. Get the source code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js runtime ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Install project dependencies ─────────────────────────────────
      - name: Install dependencies
        run: npm i

      # ── 4. Run linter (catches code style errors early) ─────────────────
      - name: Run ESLint
        run: npm run lint

      # ── 5. Run unit tests ───────────────────────────────────────────────
      - name: Run tests
        run: npm test -- --run

      # ── 6. Build the production bundle ──────────────────────────────────
      - name: Build application
        run: npm run build

      # ── 7. Upload the build output as an artifact ───────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-${{ github.sha }}
          path: dist/
          retention-days: 7
